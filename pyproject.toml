[project]
name = "f1engineer"
version = "0.1.0"
description = "Local, low-latency teaching race engineer for Codemasters/EA F1 games (UDP telemetry)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "psutil>=5.9",
    "openai>=3.40.0",
    "python-dotenv>=1.2.4",
    "faster-whisper>=1.2.1",
    "piper-tts>=1.8.0",
    "sounddevice>=0.5.6",
    "pynput>=1.8.2",
    "nvidia-ml-py>=13.615.71",
    "websockets>=17.3",
]

[project.optional-dependencies]
gpu = [
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9,<10",
]

[project.scripts]
f1engineer = "f1engineer.cli:main"

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=8",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["f1engineer"]

[tool.ruff]
line-length = 120
extend-exclude = ["scratch", "data", "models"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E741", "E501"]   # short maths names (l, L) are deliberate; long lines are mostly radio/prompt text

[tool.pytest.ini_options]
testpaths = ["tests"]
